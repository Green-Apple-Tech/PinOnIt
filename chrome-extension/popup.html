<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScheduleFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #10b981;
      --green-dark: #059669;
      --green-light: #d1fae5;
      --green-bg: #ecfdf5;
      --text: #111827;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --border: #e5e7eb;
      --bg: #ffffff;
      --bg-subtle: #f9fafb;
      --red: #ef4444;
      --red-light: #fef2f2;
      --amber: #f59e0b;
      --amber-light: #fffbeb;
      --blue: #3b82f6;
      --blue-light: #eff6ff;
      --radius: 8px;
      --radius-sm: 5px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo {
      width: 28px; height: 28px;
      background: var(--green);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 16px; height: 16px; color: white; }
    .app-name { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; color: var(--text); }
    .header-right { display: flex; align-items: center; gap: 6px; }

    /* ── Avatar / User pill ── */
    .user-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px 3px 3px;
      cursor: default;
    }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); color: white;
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .user-name { font-size: 12px; font-weight: 500; color: var(--text); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Icon button ── */
    .icon-btn {
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--text-muted); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--bg-subtle); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ── Booking link banner ── */
    .link-banner {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: var(--green-bg);
      border-bottom: 1px solid #a7f3d0;
    }
    .link-url {
      flex: 1; font-size: 12px; color: var(--green-dark);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .copy-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 10px; font-size: 12px; font-weight: 600;
      background: var(--green); color: white; border: none;
      border-radius: var(--radius-sm); cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--green-dark); }
    .copy-btn:active { transform: scale(0.97); }
    .copy-btn svg { width: 13px; height: 13px; }
    .copy-btn.copied { background: var(--green-dark); }

    /* ── Today strip ── */
    .today-strip {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 8px;
    }
    .today-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; }
    .status-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .status-chip .dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .status-chip.busy { background: var(--amber-light); color: #92400e; }
    .status-chip.busy .dot { background: var(--amber); }
    .status-chip.free { background: var(--green-bg); color: #065f46; }
    .status-chip.free .dot { background: var(--green); }
    .status-chip.unavailable { background: #f3f4f6; color: var(--text-muted); }
    .status-chip.unavailable .dot { background: var(--text-light); }

    /* ── Tabs ── */
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
      padding: 0 16px; gap: 2px;
    }
    .tab {
      padding: 8px 12px; font-size: 12px; font-weight: 500;
      color: var(--text-muted); border: none; background: none;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      position: relative; bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--green-dark); border-bottom-color: var(--green); font-weight: 600; }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--green-light); color: var(--green-dark);
      font-size: 10px; font-weight: 700; min-width: 16px; height: 16px;
      border-radius: 8px; padding: 0 4px; margin-left: 4px;
    }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Booking list ── */
    .booking-list { padding: 8px 0; max-height: 280px; overflow-y: auto; }
    .booking-list::-webkit-scrollbar { width: 4px; }
    .booking-list::-webkit-scrollbar-track { background: transparent; }
    .booking-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .booking-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 16px;
      transition: background .12s;
      cursor: default;
    }
    .booking-item:hover { background: var(--bg-subtle); }

    .booking-time-col {
      min-width: 52px; text-align: right; padding-top: 1px;
    }
    .booking-time {
      font-size: 11px; font-weight: 700; color: var(--text);
      white-space: nowrap;
    }
    .booking-date-label {
      font-size: 10px; color: var(--text-light); white-space: nowrap;
    }

    .booking-dot-col {
      display: flex; flex-direction: column; align-items: center; padding-top: 3px;
    }
    .booking-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .booking-line {
      width: 1px; background: var(--border); flex: 1; min-height: 20px; margin-top: 4px;
    }

    .booking-info { flex: 1; }
    .booking-guest { font-size: 13px; font-weight: 600; color: var(--text); }
    .booking-service { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .booking-meta {
      display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap;
    }
    .booking-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 20px;
      font-size: 10px; font-weight: 600;
    }
    .badge-confirmed { background: var(--green-light); color: #065f46; }
    .badge-duration { background: #f3f4f6; color: var(--text-muted); }

    /* ── Empty state ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 24px; text-align: center;
      color: var(--text-muted);
    }
    .empty-state svg { width: 36px; height: 36px; color: var(--border); margin-bottom: 12px; }
    .empty-state-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .empty-state-sub { font-size: 12px; color: var(--text-muted); }

    /* ── Section header ── */
    .section-header {
      padding: 10px 16px 4px;
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .6px;
    }

    /* ── Quick actions ── */
    .quick-actions {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; padding: 12px 16px;
    }
    .quick-action {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 6px; padding: 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--bg);
      cursor: pointer; text-decoration: none;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .quick-action:hover {
      border-color: var(--green); background: var(--green-bg);
      box-shadow: var(--shadow);
    }
    .quick-action-icon {
      width: 28px; height: 28px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .quick-action-icon svg { width: 15px; height: 15px; }
    .quick-action-label { font-size: 12px; font-weight: 600; color: var(--text); }
    .quick-action-sub { font-size: 11px; color: var(--text-muted); margin-top: -2px; }

    .qa-green { background: var(--green-bg); color: var(--green-dark); }
    .qa-blue { background: var(--blue-light); color: var(--blue); }
    .qa-amber { background: var(--amber-light); color: var(--amber); }
    .qa-red { background: var(--red-light); color: var(--red); }

    /* ── Stats strip ── */
    .stats-strip {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 0; border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 0;
    }
    .stat-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 8px; gap: 2px;
      border-right: 1px solid var(--border);
    }
    .stat-item:last-child { border-right: none; }
    .stat-value { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 500; text-align: center; }

    /* ── Login screen ── */
    #login-screen {
      padding: 24px 20px;
    }
    .login-logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .login-logo-icon {
      width: 36px; height: 36px; background: var(--green); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .login-logo-icon svg { width: 20px; height: 20px; color: white; }
    .login-logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
    .login-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .form-input {
      width: 100%; padding: 9px 12px; font-size: 13px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      outline: none; transition: border-color .15s, box-shadow .15s;
      background: var(--bg); color: var(--text);
    }
    .form-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }

    .btn-primary {
      width: 100%; padding: 10px; font-size: 13px; font-weight: 600;
      background: var(--green); color: white; border: none; border-radius: var(--radius-sm);
      cursor: pointer; transition: background .15s, transform .1s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: .6; cursor: default; }

    .error-msg {
      font-size: 12px; color: var(--red); background: var(--red-light);
      padding: 8px 10px; border-radius: var(--radius-sm); margin-top: 8px;
    }

    /* ── Loading ── */
    .loading-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 200px;
    }
    .spinner {
      width: 24px; height: 24px; border: 2px solid var(--border);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; border-top: 1px solid var(--border);
      background: var(--bg-subtle);
    }
    .footer-link {
      font-size: 11px; color: var(--text-muted); text-decoration: none;
      display: flex; align-items: center; gap: 4px; cursor: pointer;
      background: none; border: none;
    }
    .footer-link:hover { color: var(--text); }
    .footer-link svg { width: 12px; height: 12px; }
    .last-updated { font-size: 10px; color: var(--text-light); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1f2937; color: white; font-size: 12px; font-weight: 500;
      padding: 7px 14px; border-radius: 20px;
      opacity: 0; transition: opacity .2s, transform .2s;
      pointer-events: none; white-space: nowrap; z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
</div>

<!-- Login -->
<div id="login-screen" style="display:none">
  <div class="login-logo">
    <div class="login-logo-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
    </div>
    <span class="login-logo-text">ScheduleFlow</span>
  </div>
  <p class="login-title">Sign in to your account</p>
  <p class="login-sub">Access your bookings and scheduling link.</p>

  <div class="form-group">
    <label class="form-label" for="email">Email</label>
    <input class="form-input" id="email" type="email" placeholder="you@example.com" autocomplete="email" />
  </div>
  <div class="form-group">
    <label class="form-label" for="password">Password</label>
    <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
  </div>
  <div id="login-error" class="error-msg" style="display:none"></div>
  <button class="btn-primary" id="login-btn">Sign In</button>
</div>

<!-- Main App -->
<div id="app-screen" style="display:none">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
      <span class="app-name">ScheduleFlow</span>
    </div>
    <div class="header-right">
      <div class="user-pill">
        <div class="avatar" id="user-avatar">?</div>
        <span class="user-name" id="user-name">Loading...</span>
      </div>
      <button class="icon-btn" id="refresh-btn" title="Refresh">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
      <button class="icon-btn" id="logout-btn" title="Sign out">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Booking link banner -->
  <div class="link-banner" id="link-banner">
    <span class="link-url" id="booking-link-url">Loading...</span>
    <button class="copy-btn" id="copy-link-btn">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
      </svg>
      Copy Link
    </button>
  </div>

  <!-- Today strip -->
  <div class="today-strip">
    <span class="today-label" id="today-label">Today</span>
    <div class="status-chip" id="today-status">
      <div class="dot"></div>
      <span>Loading</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-strip">
    <div class="stat-item">
      <span class="stat-value" id="stat-today">0</span>
      <span class="stat-label">Today</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-week">0</span>
      <span class="stat-label">This Week</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-upcoming">0</span>
      <span class="stat-label">Upcoming</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="upcoming">
      Upcoming <span class="tab-count" id="upcoming-count">0</span>
    </button>
    <button class="tab" data-tab="today">Today</button>
    <button class="tab" data-tab="actions">Quick Actions</button>
  </div>

  <!-- Upcoming Panel -->
  <div class="panel active" id="panel-upcoming">
    <div class="booking-list" id="upcoming-list"></div>
  </div>

  <!-- Today Panel -->
  <div class="panel" id="panel-today">
    <div class="booking-list" id="today-list"></div>
  </div>

  <!-- Quick Actions Panel -->
  <div class="panel" id="panel-actions">
    <div class="quick-actions">
      <a class="quick-action" id="qa-dashboard" href="#" target="_blank">
        <div class="quick-action-icon qa-green">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </div>
        <span class="quick-action-label">Dashboard</span>
        <span class="quick-action-sub">View all bookings</span>
      </a>
      <a class="quick-action" id="qa-booking-page" href="#" target="_blank">
        <div class="quick-action-icon qa-blue">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
        </div>
        <span class="quick-action-label">Booking Page</span>
        <span class="quick-action-sub">Open your page</span>
      </a>
      <a class="quick-action" id="qa-availability" href="#" target="_blank">
        <div class="quick-action-icon qa-amber">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <span class="quick-action-label">Availability</span>
        <span class="quick-action-sub">Edit schedule</span>
      </a>
      <a class="quick-action" id="qa-services" href="#" target="_blank">
        <div class="quick-action-icon qa-red">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
          </svg>
        </div>
        <span class="quick-action-label">Services</span>
        <span class="quick-action-sub">Manage offerings</span>
      </a>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="footer-link" id="open-app-btn">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      Open App
    </button>
    <span class="last-updated" id="last-updated">Updated just now</span>
  </div>

</div>

<div id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
