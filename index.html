<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Branding -->
    <title>Run your business by text | PinOnIt</title>
    <link rel="icon" type="image/png" href="/pinonit_logo.png" />
    <link rel="apple-touch-icon" href="/pinonit_logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5864C6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pin on It" />

    <!-- SEO -->
    <meta name="description" content="Quote a job in the driveway. Get it approved, signed, scheduled and paid before you drive away. Booking, Sign-by-Text, and reminders by SMS, WhatsApp, email, or voice. $8.99/month." />
    <meta name="keywords" content="run business by text, Quote-by-Text, Sign-by-Text, Book-by-Text, SMS reminders, invoice by text, PinOnIt" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — homepage / product (iMessage reads static HTML; booking slugs use booking-og) -->
    <meta property="og:title" content="Run your business by text | PinOnIt" />
    <meta property="og:description" content="Quote a job in the driveway. Get it approved, signed, scheduled and paid before you drive away. Booking, Sign-by-Text, and reminders by SMS, WhatsApp, email, or voice. $8.99/month." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pinonit.com" />
    <meta property="og:image" content="https://pinonit.com/og-why-pinonit.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />

    <!-- Twitter — large landscape card for the marketing site -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Run your business by text | PinOnIt" />
    <meta name="twitter:description" content="Quote a job in the driveway. Get it approved, signed, scheduled and paid before you drive away. Booking, Sign-by-Text, and reminders by SMS, WhatsApp, email, or voice. $8.99/month." />
    <meta name="twitter:image" content="https://pinonit.com/og-why-pinonit.png" />
    <!-- Sign-by-Text (cursive label only — do not use elsewhere) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "PinOnIt",
          "legalName": "Miami Expeditions LLC",
          "url": "https://pinonit.com",
          "logo": "https://pinonit.com/pinonit_logo.png",
          "contactPoint": { "@type": "ContactPoint", "email": "support@pinonit.com", "contactType": "customer support" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "PinOnIt",
          "description": "PinOnIt is a text-first office for small businesses: quote a job, get a signature, book a time, and send reminders by SMS. $8.99/month after a 14-day trial.",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://pinonit.com",
          "offers": {
            "@type": "Offer",
            "price": "8.99",
            "priceCurrency": "USD",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "8.99",
              "priceCurrency": "USD",
              "billingDuration": "P1M"
            }
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            { "@type": "Question", "name": "What is PinOnIt?", "acceptedAnswer": { "@type": "Answer", "text": "You run the job by text. Quote it, get it signed, send a booking link, and remind them before they show up. They tap a normal SMS — no app, no account." } },
            { "@type": "Question", "name": "Does my customer need an app?", "acceptedAnswer": { "@type": "Answer", "text": "No. They get a normal text and open a link in their phone’s browser. Nothing to install, no account to create, no email required." } },
            { "@type": "Question", "name": "How do they sign?", "acceptedAnswer": { "@type": "Answer", "text": "Sign-by-Text: we text a code to their phone, they draw their signature with a finger. Meets federal ESIGN Act requirements. Every signature includes a complete audit record. PinOnIt does not provide legal advice." } },
            { "@type": "Question", "name": "How do I get paid?", "acceptedAnswer": { "@type": "Answer", "text": "Paste your own Zelle, Cash App, Venmo, or PayPal link. After they approve, they see Pay Now. PinOnIt never takes the money. When you’ve got it, one tap on the quote texts a receipt." } },
            { "@type": "Question", "name": "What about no-shows?", "acceptedAnswer": { "@type": "Answer", "text": "Reminders go out by text, WhatsApp, email, or a voice call. They reply 1 to cancel or 2 to reschedule. That’s the phone-tag loop, closed." } },
            { "@type": "Question", "name": "Does it work with my calendar?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Google and Outlook stay in sync (including new bookings). Apple Calendar connects with a private iCloud link so busy times are blocked. You can import from Calendly if you’re switching." } },
            { "@type": "Question", "name": "Is it really $8.99 a month?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. One plan. Free trial first." } }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="font-family:system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:24px;color:#0f172a;text-align:center">
        <p style="font-size:15px;font-weight:600;margin:0">Loading PinOnIt…</p>
      </div>
    </div>
    <script>
      (function () {
        var path = location.pathname || '';
        var WATCHDOG_MS = path.indexOf('/auth/callback') === 0 ? 20000 : 5000;
        var CB = '_cb';

        function isOauthReturn() {
          var p = location.pathname || '';
          return p.indexOf('/auth/callback') === 0;
        }

        // Never location.replace() on /auth/callback. A reload burns Google's one-time
        // `code` (the module script can still run after this IIFE) and iPhone users
        // have to complete Google sign-in twice. Show an error instead.

        function isAppScript(src) {
          if (!src) return false;
          return src.indexOf('/assets/') !== -1 || src.indexOf('/src/main.') !== -1;
        }

        function show(msg) {
          var r = document.getElementById('root');
          if (!r) return;
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:24px;color:#0f172a">' +
            '<h1 style="font-size:20px;font-weight:700;margin:0 0 8px">PinOnIt did not load</h1>' +
            '<p style="font-size:14px;line-height:1.5;color:#475569">' + msg + '</p>' +
            '<p style="font-size:13px;line-height:1.5;color:#64748b;margin-top:12px">Close this tab and open <a href="https://pinonit.com/login">pinonit.com/login</a>, or hard-refresh (Safari: hold reload).</p></div>';
        }

        /** URL cache-bust — sessionStorage alone fails in some iOS privacy modes. */
        function hardReload() {
          try {
            var url = new URL(window.location.href);
            if (!url.searchParams.has(CB)) {
              url.searchParams.set(CB, String(Date.now()));
              window.location.replace(url.href);
              return;
            }
          } catch (e) { /* fall through */ }
          show('Could not refresh this page. Close the tab and open pinonit.com/login again.');
        }

        function recoverOrShow(msg) {
          if (isOauthReturn()) {
            show(msg);
            return;
          }
          try {
            var url = new URL(window.location.href);
            if (!url.searchParams.has(CB)) {
              hardReload();
              return;
            }
          } catch (e) {
            hardReload();
            return;
          }
          show(msg);
        }

        function looksLikeStaleModule(msg) {
          if (!msg) return false;
          return /Failed to fetch dynamically imported module|Loading chunk|Importing a module script failed|error loading dynamically imported module|Failed to load module script/i.test(
            String(msg),
          );
        }

        window.addEventListener('error', function (e) {
          if (window.__PINONIT_BOOTED__) return;
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && isAppScript(t.src)) {
            recoverOrShow('A script failed to load. Close this tab and open pinonit.com/login again.');
            return;
          }
          if (e.message && looksLikeStaleModule(e.message)) {
            recoverOrShow(e.message);
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (window.__PINONIT_BOOTED__) return;
          var reason = e && e.reason;
          var msg = reason && reason.message ? reason.message : String(reason || '');
          if (looksLikeStaleModule(msg)) {
            recoverOrShow(msg);
          }
        });

        // bfcache restore after Google redirect — force a real reload, but never on
        // the OAuth callback (that would reuse or drop the one-time `code`).
        window.addEventListener('pageshow', function (e) {
          if (!e.persisted) return;
          var path = location.pathname || '';
          var q = location.search || '';
          if (
            path.indexOf('/auth/callback') === 0 ||
            /[?&]code=/.test(q) ||
            /[?&]error=/.test(q)
          ) {
            return;
          }
          try {
            var url = new URL(location.href);
            url.searchParams.set(CB, String(Date.now()));
            window.location.replace(url.href);
          } catch (err) {
            window.location.reload();
          }
        });

        window.setTimeout(function () {
          if (window.__PINONIT_BOOTED__) return;
          var r = document.getElementById('root');
          if (!r) return;
          // Splash only — React never mounted
          if (r.querySelector('#boot-splash') && r.children.length <= 1) {
            recoverOrShow('The app took too long to start. Refreshing…');
          }
        }, WATCHDOG_MS);
      })();
    </script>
    <!-- Vite entry. `vite build` replaces this with /assets/index-*.js. Do not delete. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
