<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Branding -->
    <title>Your mini office by text | PinOnIt</title>
    <link rel="icon" type="image/png" href="/pinonit_logo.png" />
    <link rel="apple-touch-icon" href="/pinonit_logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5864C6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pin on It" />

    <!-- SEO -->
    <meta name="description" content="Booking + Sign by Text — waivers, NDAs, addendums, quotes, invoices. One simple app. $8.99/mo." />

    <meta property="og:title" content="Your mini office by text" />
    <meta property="og:description" content="Booking + Sign by Text — waivers, NDAs, addendums, quotes, invoices. One simple app. $8.99/mo." />

    <meta property="og:image" content="https://pinonit.com/pinonit_logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your mini office by text" />
    <meta name="twitter:description" content="Booking + Sign by Text — waivers, NDAs, addendums, quotes, invoices. One simple app. $8.99/mo." />
