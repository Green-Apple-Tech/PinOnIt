<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Branding -->
    <title>Your mini office by text | PinOnIt</title>
    <link rel="icon" type="image/png" href="/pinonit_logo.png" />
    <link rel="apple-touch-icon" href="/pinonit_logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5864C6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pin on It" />

    <!-- SEO -->
    <meta name="description" content="Booking + Sign by Text — waivers, NDAs, addendums, quotes, invoices. One simple app. $8.99/mo." />
    <meta name="keywords" content="run business by text, SMS booking, Sign by Text, waiver by text, NDA by SMS, invoice by text, Calendly alternative, Doc Center, PinOnIt" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (iMessage / email link previews read these from static HTML) -->
    <meta property="og:title" content="Book a Meeting - Click This Link" />
    <meta property="og:description" content="Pick a time to meet. Click this link." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pinonit.com" />
    <meta property="og:image" content="https://pinonit.com/pinonit_logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Book a Meeting - Click This Link" />
    <meta name="twitter:description" content="Pick a time to meet. Click this link." />
    <meta name="twitter:image" content="https://pinonit.com/pinonit_logo.png" />
    <!-- Sign-by-Text (cursive label only — do not use elsewhere) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function isAppScript(src) {
          if (!src) return false;
          return src.indexOf('/assets/') !== -1 || src.indexOf('/src/main.') !== -1;
        }
        function show(msg) {
          var r = document.getElementById('root');
          if (!r || r.childElementCount) return;
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:24px;color:#0f172a">' +
            '<h1 style="font-size:20px;font-weight:700;margin:0 0 8px">PinOnIt did not load</h1>' +
            '<p style="font-size:14px;line-height:1.5;color:#475569">' + msg + '</p></div>';
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && isAppScript(t.src)) {
            show('A script failed to load. Hard-refresh with Cmd+Shift+R, or open pinonit.com in a new tab.');
          }
        }, true);
      })();
    </script>
    <!-- Vite entry. `vite build` replaces this with /assets/index-*.js. Do not delete. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
