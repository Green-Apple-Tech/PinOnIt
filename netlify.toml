[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Booking / reserved single-segment paths — OG tags via booking-og (SPA shell)
[[redirects]]
  from = "/:slug"
  to = "https://adlusgtlwgcfyxgeoias.supabase.co/functions/v1/booking-og/:slug"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npx vite build"
  publish = "dist"

# Never cache the HTML shell. Do not put a year-long cache on /assets/* —
# a Publish race 404 would be stored as immutable and the page stays blank.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
