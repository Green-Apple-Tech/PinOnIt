# Host booking slugs — Netlify function forces text/html Content-Type
[[redirects]]
  from = "/:slug"
  to = "/.netlify/functions/booking-shell?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npx vite build && npx vite-node scripts/prerender-seo.ts"
  publish = "dist"
  functions = "netlify/functions"

# Never cache the HTML shell. Do not put a year-long cache on /assets/* —
# a Publish race 404 would be stored as immutable and the page stays blank.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/auth/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# Guest token URLs share index.html (index, follow). Header noindex is the crawler-visible signal.
[[headers]]
  for = "/d"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/d/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
