[[redirects]]
from = "/assets/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/src/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build]
command = "npx vite build"
publish = "dist"

# index.html must never be cached so new deploys are picked up
# immediately — hashed assets in /assets/ are safe to cache forever.
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"