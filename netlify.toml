# PinOnIt is a Vite SPA on Netlify (Bolt Publish).
# Do not rewrite missing /assets/*.js to index.html — the browser then
# executes HTML as a module and the page stays blank after a Publish race.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
